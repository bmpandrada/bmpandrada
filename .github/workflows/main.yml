name: Generate Datas

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate snake SVG (Platane/snk)
        uses: Platane/snk@master
        id: snake-gif
        with:
          github_user_name: bmpandrada
          svg_out_path: dist/github-contribution-grid-snake.svg

      - name: Show generated files (debug)
        run: |
          echo "=== pwd ==="
          pwd
          echo "=== list dist ==="
          ls -la dist || true
          echo "=== head of file ==="
          if [ -f "dist/github-contribution-grid-snake.svg" ]; then
            head -n 5 dist/github-contribution-grid-snake.svg
          else
            echo "SVG not found"
          fi

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
          allow_empty_commit: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
